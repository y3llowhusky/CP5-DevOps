<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Argos | Monitoramento de riscos</title>
<style>
:root{font:16px system-ui,sans-serif;color:#e6edf7;background:#0e1729}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;color:#65d3d4}p{color:#afbdce}section{background:#17253c;border:1px solid #2d405f;border-radius:16px;padding:22px;margin:24px 0}h2{margin:0 0 20px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}label{font-size:.85rem;color:#bfd1e8}input,select,textarea{display:block;margin-top:5px;width:100%;padding:10px;background:#0f1c30;color:white;border:1px solid #516986;border-radius:7px}textarea{min-height:42px}button{border:0;border-radius:7px;padding:10px 14px;background:#46c5be;color:#0b1b2b;font-weight:700;cursor:pointer}.secondary{background:#344b69;color:white}.danger{background:#b34553;color:white}.actions{display:flex;gap:8px;grid-column:1/-1}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;border-bottom:1px solid #34465f;padding:11px 8px}td:last-child{white-space:nowrap}small{color:#a4b6c9}#message{min-height:20px;color:#89e4b7}.scroll{overflow-x:auto}@media(max-width:650px){header{display:block}td:last-child{white-space:normal}button{margin:3px}}
</style></head><body>
<header><div><h1>ARGOS</h1><p>Painel de zonas de risco e alertas oficiais</p></div><span id="status">● Conectando...</span></header>
<div id="message" role="status" aria-live="polite"></div>
<section><h2>Zonas de risco</h2>
<form id="zone-form"><input type="hidden" name="id"><label>Nome<input name="nome" required maxlength="120" placeholder="Margem do Rio Tietê"></label><label>Cidade<input name="cidade" required maxlength="120" placeholder="São Paulo"></label><label>UF<input name="estado" required maxlength="2" minlength="2" placeholder="SP"></label><label>Latitude<input name="latitude" type="number" step="any" min="-90" max="90" required value="-23.55"></label><label>Longitude<input name="longitude" type="number" step="any" min="-180" max="180" required value="-46.63"></label><label>Região<input name="regiao" maxlength="40"></label><label>Nível<select name="nivelRiscoAtual"><option>BAIXO</option><option>MEDIO</option><option>ALTO</option><option>CRITICO</option></select></label><label>Descrição<input name="descricao" maxlength="300"></label><label>Ativa<select name="ativa"><option value="true">Sim</option><option value="false">Não</option></select></label><div class="actions"><button>Salvar zona</button><button type="reset" class="secondary">Limpar</button></div></form>
<div class="scroll"><table><thead><tr><th>ID</th><th>Zona</th><th>Local</th><th>Nível</th><th>Ações</th></tr></thead><tbody id="zones"></tbody></table></div></section>
<section><h2>Alertas</h2>
<form id="alert-form"><input type="hidden" name="id"><label>Zona<select name="zonaRiscoId" required></select></label><label>Título<input name="titulo" required maxlength="160"></label><label>Nível<select name="nivelAlerta"><option>BAIXO</option><option>MEDIO</option><option>ALTO</option><option>CRITICO</option></select></label><label>Descrição<textarea name="descricao" required maxlength="2000"></textarea></label><label>Ativo<select name="ativo"><option value="true">Sim</option><option value="false">Não</option></select></label><div class="actions"><button>Salvar alerta</button><button type="reset" class="secondary">Limpar</button></div></form>
<div class="scroll"><table><thead><tr><th>ID</th><th>Zona</th><th>Título</th><th>Nível</th><th>Ações</th></tr></thead><tbody id="alerts"></tbody></table></div></section>
<script>
let zones=[],alerts=[];const $=s=>document.querySelector(s),message=t=>{$('#message').textContent=t};
async function request(path,options){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});if(r.status===204)return null;const data=await r.json();if(!r.ok)throw Error(data.erro||data.title||`HTTP ${r.status}`);return data}
function cell(row,value){const td=document.createElement('td');td.textContent=String(value??'');row.append(td)}
function buttons(row,kind,id){const td=document.createElement('td');for(const [text,action,css] of [['Editar','edit','secondary'],['Excluir','delete','danger']]){const b=document.createElement('button');b.textContent=text;b.className=css;b.type='button';b.onclick=()=>operate(kind,id,action);td.append(b)}row.append(td)}
async function refresh(){try{[zones,alerts]=await Promise.all([request('/zonas-risco'),request('/alertas')]);$('#status').textContent='● Conectado';const select=$('#alert-form [name=zonaRiscoId]');const old=select.value;select.replaceChildren();for(const z of zones){const o=new Option(`${z.id} · ${z.nome}`,z.id);select.append(o)}select.value=old||select.options[0]?.value||'';
const zbody=$('#zones');zbody.replaceChildren();for(const z of zones){const row=document.createElement('tr');cell(row,z.id);cell(row,z.nome);cell(row,`${z.cidade}/${z.estado}`);cell(row,z.nivelRiscoAtual);buttons(row,'zone',z.id);zbody.append(row)}
const abody=$('#alerts');abody.replaceChildren();for(const a of alerts){const row=document.createElement('tr');cell(row,a.id);cell(row,a.zona);cell(row,a.titulo);cell(row,a.nivelAlerta);buttons(row,'alert',a.id);abody.append(row)}}catch(e){$('#status').textContent='● Erro';message(e.message)}}
function fill(form,item){for(const [k,v] of Object.entries(item)){const input=form.elements.namedItem(k);if(input)input.value=String(v??'')}form.scrollIntoView({behavior:'smooth'})}
async function operate(kind,id,action){const endpoint=kind==='zone'?'zonas-risco':'alertas',item=(kind==='zone'?zones:alerts).find(x=>x.id===id);if(action==='edit'){fill($(kind==='zone'?'#zone-form':'#alert-form'),item);return}if(!confirm(`Excluir ${kind==='zone'?'zona':'alerta'} ${id}?`))return;try{await request(`/${endpoint}/${id}`,{method:'DELETE'});message('Excluído. Confira a tabela no Azure SQL.');await refresh()}catch(e){message(e.message)}}
for(const [formId,path,keys] of [['zone-form','zonas-risco',['latitude','longitude']],['alert-form','alertas',['zonaRiscoId']]]){$(`#${formId}`).addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,values=Object.fromEntries(new FormData(form));const id=values.id;delete values.id;for(const k of keys)values[k]=Number(values[k]);values[formId==='zone-form'?'ativa':'ativo']=values[formId==='zone-form'?'ativa':'ativo']==='true';try{await request(`/${path}${id?'/'+id:''}`,{method:id?'PUT':'POST',body:JSON.stringify(values)});form.reset();message('Salvo. Confira a tabela no Azure SQL.');await refresh()}catch(err){message(err.message)}})}refresh();
</script></body></html>
